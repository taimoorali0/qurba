# ===== QURBA: Nginx site — no Cloudflare. Starts on HTTP; certbot then adds HTTPS =====
# Works for a main domain or a subdomain (e.g. qurba.example.com).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/qurba/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Hashed Vite assets: cache for a year
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Service worker + manifest must always be fresh
    location = /sw.js { add_header Cache-Control "no-cache"; add_header Service-Worker-Allowed "/"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; try_files $uri =404; }
    location /brand/ { expires 30d; try_files $uri =404; }
    # App sounds uploaded in /admin; cached briefly so replacements show up
    location /audio/ { expires 1h; try_files $uri =404; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
}
